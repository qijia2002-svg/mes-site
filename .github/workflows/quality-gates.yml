name: Quality Gates

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ── Gate 1: 类型检查（worker + web 双 workspace） ──
      - name: TypeCheck
        run: npm run typecheck

      # ── Gate 2: 构建（vite → worker/dist） ──
      - name: Build
        run: npm run build --workspace web
        env:
          # Windows EPERM 坑不适用于 Linux CI，直接构建
          CI: true

      # ── Gate 3: 判题哈希回归护栏（P0：改 dataset.sql 不重算哈希 = 全站静默误判） ──
      #    从线上 D1 取存储哈希，用本地 dataset.sql 重算，逐题比对。
      #    任一 FAIL → 阻断合并。21/21 通过才放行。
      #    需要 Cloudflare 凭证（D1 远程查询）；若未配置则跳过并 ⚠️ 提醒。
      - name: SQL Hash Regression
        if: secrets.CLOUDFLARE_API_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/gen-answer-hash.mjs --regress

      - name: Hash Regression Skipped Warning
        if: secrets.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "::warning::CLOUDFLARE_API_TOKEN 未配置，跳过判题哈希回归护栏。"
          echo "::warning::请到 Settings → Secrets → Actions 添加 CLOUDFLARE_API_TOKEN 和 CLOUDFLARE_ACCOUNT_ID"
          echo "::warning::否则 dataset.sql 改动导致的判题静默失效无法被自动捕获（已发生过 #2 误判）"
